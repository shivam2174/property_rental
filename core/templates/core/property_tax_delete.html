<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Property Tax</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #dc2626;
        }

        .warning {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .details {
            margin-bottom: 25px;
        }

        .details p {
            margin: 10px 0;
        }

        .label {
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
        }

        .cancel-btn:hover {
            background: #4b5563;
        }

        @media (max-width: 600px) {

            .container {
                margin: 25px auto;
                padding: 0 12px;
            }

            .card {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Delete Property Tax</h1>

        <div class="warning">
            Are you sure you want to delete this property tax record?
            This action cannot be undone.
        </div>

        <div class="details">

            <p>
                <span class="label">Property:</span>
                {{ property.name }}
            </p>

            <p>
                <span class="label">Tax Year:</span>
                {{ tax.tax_year }}
            </p>

            <p>
                <span class="label">Tax Amount:</span>
                ₹{{ tax.tax_amount|floatformat:2 }}
            </p>

            <p>
                <span class="label">Status:</span>
                {{ tax.get_status_display }}
            </p>

        </div>

        <div class="actions">

            <form method="post">
                {% csrf_token %}

                <button
                    type="submit"
                    class="btn delete-btn"
                >
                    Yes, Delete
                </button>

            </form>

            <a
                href="{% url 'property_detail' property.id %}"
                class="btn cancel-btn"
            >
                Cancel
            </a>

        </div>

    </div>

</div>

</body>

</html>
