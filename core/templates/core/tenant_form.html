<!DOCTYPE html>
<html>
<head>

    <title>Add Tenant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #111827;
        }

        .header p {
            margin: 8px 0 0;
            color: #6b7280;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 7px;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .buttons {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 11px 22px;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-save {
            background: #2563eb;
            color: white;
        }

        .btn-save:hover {
            background: #1d4ed8;
        }

        .btn-cancel {
            background: #6b7280;
            color: white;
        }

        .btn-cancel:hover {
            background: #4b5563;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h1>Add Tenant</h1>
            <p>Enter tenant master information</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="error-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-grid">

                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter tenant full name"
                        required
                    >

                </div>


                <!-- FATHER NAME -->
                <div class="form-group">

                    <label for="father_name">
                        Father Name
                    </label>

                    <input
                        type="text"
                        id="father_name"
                        name="father_name"
                        placeholder="Enter father's name"
                    >

                </div>


                <!-- MOBILE -->
                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter mobile number"
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                    >

                </div>


                <!-- PERMANENT ADDRESS -->
                <div class="form-group full-width">

                    <label for="permanent_address">
                        Permanent Address
                    </label>

                    <textarea
                        id="permanent_address"
                        name="permanent_address"
                        placeholder="Enter permanent address"
                    ></textarea>

                </div>


                <!-- ID TYPE -->
                <div class="form-group">

                    <label for="id_type">
                        ID Type
                    </label>

                    <select id="id_type" name="id_type">

                        <option value="aadhaar">
                            Aadhaar
                        </option>

                        <option value="pan">
                            PAN
                        </option>

                        <option value="passport">
                            Passport
                        </option>

                        <option value="driving_license">
                            Driving License
                        </option>

                        <option value="voter_id">
                            Voter ID
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- ID NUMBER -->
                <div class="form-group">

                    <label for="id_number">
                        ID Number
                    </label>

                    <input
                        type="text"
                        id="id_number"
                        name="id_number"
                        placeholder="Enter ID number"
                    >

                </div>


                <!-- MOVE IN DATE -->
                <div class="form-group">

                    <label for="move_in_date">
                        Move-in Date
                    </label>

                    <input
                        type="date"
                        id="move_in_date"
                        name="move_in_date"
                    >

                </div>


                <!-- SECURITY DEPOSIT -->
                <div class="form-group">

                    <label for="security_deposit">
                        Security Deposit
                    </label>

                    <input
                        type="number"
                        id="security_deposit"
                        name="security_deposit"
                        placeholder="Enter security deposit"
                        step="0.01"
                        min="0"
                        value="0"
                    >

                </div>


                <!-- STATUS -->
                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status" name="status">

                        <option value="active" selected>
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="btn btn-save"
                >
                    Save Tenant
                </button>

                <a
                    href="{% url 'tenant_list' %}"
                    class="btn btn-cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
