<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Property</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
        }

        .header-inner {
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 6px 0 0;
            color: #d1d5db;
        }

        /* =========================
           HEADER NAVIGATION
        ========================= */

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .btn-back {
            background: #6b7280;
            color: white;
        }

        .btn-back:hover {
            background: #4b5563;
        }

        .btn-dashboard {
            background: #2563eb;
            color: white;
        }

        .btn-dashboard:hover {
            background: #1d4ed8;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* =========================
           SAVE BUTTON
        ========================= */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn-save {
            background: #2563eb;
            color: white;
        }

        .btn-save:hover {
            background: #1d4ed8;
        }

        /* =========================
           DELETE SECTION
        ========================= */

        .delete-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        .delete-warning {
            color: #991b1b;
            background: #fef2f2;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                padding: 18px;
            }

            .header-inner {
                flex-direction: column;
                align-items: stretch;
            }

            .header-buttons {
                flex-direction: column;
            }

            .header-buttons .btn {
                width: 100%;
                text-align: center;
            }

            .container {
                margin: 20px auto;
                padding: 0 15px;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons .btn,
            .buttons button {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <div class="header-inner">

            <div>

                <h1>Edit Property</h1>

                <p>Update property information</p>

            </div>


            <!-- =========================
                 NAVIGATION
            ========================= -->

            <div class="header-buttons">

                <a
                    href="{% url 'property_list' %}"
                    class="btn btn-back"
                >
                    ← Back to Properties
                </a>

                <a
                    href="{% url 'dashboard' %}"
                    class="btn btn-dashboard"
                >
                    🏠 Dashboard
                </a>

            </div>

        </div>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <div class="container">

        <div class="card">


            <!-- =========================
                 MESSAGES
            ========================= -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- =========================
                 EDIT FORM
            ========================= -->

            <form method="POST">

                {% csrf_token %}


                <!-- OWNER -->

                <div class="form-group">

                    <label>
                        Owner / Company *
                    </label>

                    <select
                        name="owner"
                        required
                    >

                        <option value="">
                            Select Owner
                        </option>

                        {% for owner in owners %}

                            <option
                                value="{{ owner.id }}"
                                {% if property.owner_id == owner.id %}
                                    selected
                                {% endif %}
                            >

                                {{ owner.name }}

                                {% if owner.company_name %}
                                    - {{ owner.company_name }}
                                {% endif %}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- PROPERTY NAME -->

                <div class="form-group">

                    <label>
                        Property Name *
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ property.name }}"
                        required
                    >

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label>
                        Address *
                    </label>

                    <textarea
                        name="address"
                        required
                    >{{ property.address }}</textarea>

                </div>


                <!-- CITY -->

                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input
                        type="text"
                        name="city"
                        value="{{ property.city }}"
                    >

                </div>


                <!-- STATE -->

                <div class="form-group">

                    <label>
                        State
                    </label>

                    <input
                        type="text"
                        name="state"
                        value="{{ property.state }}"
                    >

                </div>


                <!-- PINCODE -->

                <div class="form-group">

                    <label>
                        Pincode
                    </label>

                    <input
                        type="text"
                        name="pincode"
                        value="{{ property.pincode }}"
                    >

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label>
                        Property Status
                    </label>

                    <select name="status">

                        <option
                            value="active"
                            {% if property.status == "active" %}
                                selected
                            {% endif %}
                        >
                            Active
                        </option>

                        <option
                            value="inactive"
                            {% if property.status == "inactive" %}
                                selected
                            {% endif %}
                        >
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- =========================
                     SAVE
                ========================= -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-save"
                    >
                        ✓ Save Changes
                    </button>

                </div>

            </form>


            <!-- =========================
                 DELETE PROPERTY
            ========================= -->

            <div class="delete-section">

                <div class="delete-warning">

                    ⚠️ Deleting this property may affect
                    related units, renters, agreements,
                    and invoices.

                </div>


                <form
                    method="POST"
                    action="{% url 'property_delete' property.id %}"
                    onsubmit="return confirm(
                        'Are you sure you want to delete this property? This action cannot be undone.'
                    );"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-delete"
                    >
                        🗑 Delete Property
                    </button>

                </form>

            </div>


        </div>

    </div>

</body>

</html>
