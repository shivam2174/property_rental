
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Report</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f4f6f9;
            color: #1d2939;
            font-family: Arial, sans-serif;
        }
        .container { max-width: 1400px; margin: auto; padding: 24px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            background: #fff;
            padding: 24px;
            border: 1px solid #e3e8ef;
            border-radius: 10px;
        }
        h1 { margin: 0 0 18px; font-size: 25px; }
        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
        }
        .summary-item { min-width: 150px; }
        .summary-item span {
            display: block;
            color: #667085;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .summary-item strong { font-size: 22px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            padding: 11px 16px;
            border-radius: 6px;
            background: #175cd3;
            color: white;
            border: 0;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn.secondary { background: #344054; }
        .panel {
            background: white;
            margin-top: 22px;
            padding: 24px;
            border-radius: 10px;
            border: 1px solid #e3e8ef;
        }
        .panel h2 { margin-top: 0; font-size: 19px; }
        .muted { color: #667085; font-size: 14px; line-height: 1.6; }
        @media (max-width: 650px) {
            .container { padding: 12px; }
            .header { padding: 18px; }
            .summary { gap: 20px; }
            .summary-item { min-width: 130px; }
            .summary-item strong { font-size: 19px; }
            .actions { width: 100%; }
            .actions .btn { flex: 1; text-align: center; }
        }
        @media print {
            body { background: white; }
            .container { padding: 0; }
            .no-print { display: none !important; }
            .header { border: 1px solid #ddd; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>Financial Report</h1>

            <div class="summary">
                
            </div>
        </div>

        <div class="actions no-print">
             <a class="btn secondary" href="/">Home</a>
        </div>
    </div>
    <div class="panel">
        <h2>Monthly GSIT Report</h2>
        <a class="btn" href="{% url 'monthly_gst_report' %}">
            Monthly GSIT Report
        </a>
    </div>

    <div class="panel">
        <h2>Month-wise Financial Reports</h2>
        <a class="btn" href="{% url 'month_wise_financial_report' %}">
            Open Month-wise Report
        </a>
    </div>
     <div class="panel">
        <h2>TDS Ledger Report</h2>
        <a class="btn" href="{% url 'tds_ledger_report' %}">
            TDS Ledger
        </a>
    </div>
    <div class="panel">
        <h2>GST Ledger Report</h2>
        <a class="btn" href="{% url 'gst_ledger_report' %}">
            GST Ledger
        </a>
    </div>
</div>
</body>
</html>
